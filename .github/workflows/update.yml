name: Weekly stock screener update

on:
  schedule:
    # 毎週土曜 07:00 JST = 金曜 22:00 UTC
    - cron: "0 22 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: stock-screener
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly pipeline
        working-directory: stock-screener
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.main

      - name: Commit updated database (ranking history must never be lost)
        working-directory: stock-screener
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly data update $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No database changes to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stock-screener/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

